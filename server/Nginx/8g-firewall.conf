# 8G:[QUERY STRING]
if ($query_string ~* "((%2d|-)[^=]+$|([a-z0-9]{4000,})|(/|%2f)(:|%3a)(/|%2f)|(etc/(hosts|motd|shadow))|order(\s|%20)by(\s|%20)1--|(/|%2f)(\*|%2a)(\*|%2a)(/|%2f))") { return 403; }
if ($query_string ~* "(`|<|>|\^|\|\\|0x00|%00|%0d%0a|f?ckfinder|f?ckeditor|fullclick|((.*)header:|(.*)set-cookie:(.*)=)|localhost|127(\.|%2e)0(\.|%2e)0(\.|%2e)1)") { return 403; }
if ($query_string ~* "(cmd|command)(=|%3d)(chdir|mkdir)|(globals|mosconfig([a-z_]{1,22})|(?<!SAML)request)(=|\[)|(/|%2f)((wp-)?config)((\.|%2e)inc)?((\.|%2e)php))") { return 403; }
if ($query_string ~* "(thumbs?(_editor|open)?|tim(thumbs?)?)((\.|%2e)php)|(absolute_|base|root_)(dir|path)(=|%3d)(ftp|https?)|(s)?(ftp|inurl|php)(s)?(:(/|%2f|%u2215)(/|%2f|%u2215)))") { return 403; }
if ($query_string ~* "((boot|win)((\.|%2e)ini)|etc(/|%2f)passwd|self(/|%2f)environ)|(benchmark|exec|fopen|function|html)(.*)(\(|%28)|(php)([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}))") { return 403; }
if ($query_string ~* "(e|%65|%45)(v|%76|%56)(a|%61|%31)(l|%6c|%4c)(.*)(\(|%28)|(<|%3c)(.*)(e|%65|%45)(m|%6d|%4d)(b|%62|%42)(e|%65|%45)(d|%64|%44)(.*)(>|%3e))") { return 403; }
if ($query_string ~* "(<|%3c)(.*)(i|%69|%49)(f|%66|%46)(r|%72|%52)(a|%61|%41)(m|%6d|%4d)(e|%65|%45)(.*)(>|%3e)|(<|%3c)(.*)(o|%4f|%6f)(b|%62|%42)(j|%4a|%6a)(e|%65|%45)(c|%63|%43)(t|%74|%54)(.*)(>|%3e))") { return 403; }
if ($query_string ~* "(<|%3c)(.*)(s|%73|%53)(c|%63|%43)(r|%72|%52)(i|%69|%49)(p|%70|%50)(t|%74|%54)(.*)(>|%3e)|(\+|%2b|%20)(d|%64|%44)(e|%65|%45)(l|%6c|%4c)(e|%65|%45)(t|%74|%54)(e|%65|%45)(\+|%2b|%20))") { return 403; }
if ($query_string ~* "(\+|%2b|%20)(i|%69|%49)(n|%6e|%4e)(s|%73|%53)(e|%65|%45)(r|%72|%52)(t|%74|%54)(\+|%2b|%20)|(\+|%2b|%20)(s|%73|%53)(e|%65|%45)(l|%6c|%4c)(e|%65|%45)(c|%63|%43)(t|%74|%54)(\+|%2b|%20))") { return 403; }
if ($query_string ~* "(@copy|\$_(files|get|post)|allow_url_(fopen|include)|auto_prepend_file|blexbot|browsersploit|call_user_func_array|(php|web)shell|curl(_exec|test))") { return 403; }
if ($query_string ~* "(union)(.*)(select)(.*)(\(|%28)|(concat|eval)(.*)(\(|%28)") { return 403; }

# 8G:[REQUEST URI]
if ($request_uri ~* "(,,|-------|\^|`|<|>|\\|\||([a-z0-9]{2000,}))") { return 403; }
if ($request_uri ~* "(\.(s?ftp-?)config|(s?ftp-?)config\.)|(/)(f?ckfinder|fck/|fckeditor|fullclick)|(/)(cgi_?)?alfa(_?cgiapi|_?data|_?v[0-9]+)?(\.php)") { return 403; }
if ($request_uri ~* "(archive|backup|db|master|sql|wp|www|wwwroot)\.(gz|zip)|(/)(etc|var)(/)(hidden|secret|shadow|ninja|passwd|tmp)") { return 403; }
if ($request_uri ~* "(\.)(ds_store|htaccess|htpasswd|init?|mysql-select-db)(/)?$|(/)(bin)(/)(cc|chmod|chsh|cpp|echo|id|kill|mail|nasm|perl|ping|ps|python|tclsh)(/)?$") { return 403; }
if ($request_uri ~* "(\(null\)|\{\$itemURL\}|cast\(0x|echo(.*)kae|etc/passwd|eval\(|null(.*)null|open_basedir|self/environ|\+union\+all\+select)") { return 403; }

# 8G:[USER AGENT]
if ($http_user_agent ~* "([a-z0-9]{2000,})|(&lt;|%0a|%0d|%27|%3c|%3e|%00|0x00|\\\x22|\\\")") { return 403; }
if ($http_user_agent ~* "(ahrefs|archiver|curl|libwww-perl|pycurl|scan|acapbot|acoonbot|alexibot|antbot|asterias|attackbot|awario|babbar|backdor|barkrowler|becomebot|binlar|bitsightbot|blackwidow|blekkobot|blex|blowfish|bullseye|bunnys|butterfly|bytespider|careerbot|casper|censysinspect)") { return 403; }
if ($http_user_agent ~* "(semalt|seokicks|seznambot|siclab|sindice|sistrix|sitebot|siteexplorer|sitesnagger|skygrid|smartdownload|snoopy|sosospider|spankbot|spbot|sqlmap|stackrambler|stripper|sucker|surftbot)") { return 403; }

# 8G:[REQUEST METHOD]
if ($request_method ~* "^(connect|debug|move|trace|track)$") { return 403; }
