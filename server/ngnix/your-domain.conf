# =========================================================
# UPSTREAM → VARNISH
# =========================================================
upstream varnish_backend {
    server 127.0.0.1:6081;
    keepalive 128;
}

# =========================================================
# MAIN HTTPS TERMINATOR (NGINX → VARNISH → APACHE/PHP-FPM)
# =========================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name
        YOUR-DOMAIN.com *.YOUR-DOMAIN.com

    ssl_certificate     /etc/ssl/certs/YOUR-DOMAIN.com.pem;
    ssl_certificate_key /etc/ssl/private/YOUR-DOMAIN.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;

    # TLS performance + stability
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # off for Cloudflare origin certs
    ssl_stapling off;
    ssl_stapling_verify off;
    resolver 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;

    # Uploads / long requests
    client_max_body_size 2G;
    client_body_timeout 900s;
    send_timeout 900s;

    # Buffers for WordPress Multisite responses (effective only when proxy_buffering on)
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    proxy_connect_timeout 60s;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    # Helpful for small upload buffering without harming TUS (TUS overrides below)
    client_body_buffer_size 512k;

    # =========================================================
    # TUS NODE DIRECT (NO VARNISH) — keep streaming, no buffering
    # =========================================================
    location ^~ /files/ {
        #proxy_pass http://127.0.0.1:1080;
        proxy_pass http://varnish_backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Disable buffering for Chunked/XHR transport methods 
        # while keeping it ON for standard page loads.
        if ($http_transfer_encoding ~* "chunked") {
            proxy_request_buffering off;
        }

        proxy_buffering on;

        proxy_redirect http://127.0.0.1:1080/ https://$host/files/;
    }

    # =========================================================
    # NORMAL TRAFFIC → VARNISH — enable buffering + reuse conns
    # =========================================================
    location / {
        proxy_pass http://varnish_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # IMPORTANT: buffering ON for normal traffic (keep OFF only for /files/)
        proxy_request_buffering on;
        proxy_buffering on;
    }

    # Block XML-RPC completely (no PHP, no Varnish, no Redis)
    location = /xmlrpc.php {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# =========================================================
# FORCE HTTPS
# =========================================================
server {
    listen 80;
    listen [::]:80;

    server_name
        YOUR-DOMAIN.com *.YOUR-DOMAIN.com;

    return 301 https://$host$request_uri;
}

