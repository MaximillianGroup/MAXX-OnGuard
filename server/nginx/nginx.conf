user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_rlimit_nofile 200000;
    worker_connections 4096;
    # Bumped for high-concurrency multisite
    multi_accept on;
}

http {
    ##
    # Basic Settings
    ##
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    # increase to handle large sized headers
    server_names_hash_bucket_size 128;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # UPSTREAM → VARNISH
    ##
    upstream varnish_backend {
        server 127.0.0.1:6081;
        keepalive 128;
    }

    ##
    # Buffering & Timeouts (Optimized for WordPress + TUS)
    ##
    client_max_body_size 2G;
    client_body_buffer_size 512k;
    client_body_timeout 900s;
    send_timeout 900s;
    keepalive_requests 10000;
    keepalive_timeout 65;

    proxy_connect_timeout 60s;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    # Buffers for large Multisite header responses
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
   
    ##
    # Buffering & Timeouts (Optimized for WordPress + TUS)
    ##
    client_max_body_size 2G;
    client_body_buffer_size 512k;
    client_body_timeout 900s;
    send_timeout 900s;

    proxy_connect_timeout 60s;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    # Buffers for large Multisite header responses
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    ##
    # SSL Settings
    ##
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cloudflare Origin Certs don't need stapling
    ssl_stapling off;
    ssl_stapling_verify off;
    resolver 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;

    ##
    # Trust Cloudflare (Real IP)
    ##
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    include /etc/nginx/snippets/cloudflare-ips.conf;

    ##
    # Security Headers
    ##
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Slow Loris protections
    client_header_timeout 60s;
    large_client_header_buffers 4 32k;

    ##
    # Gzip Settings (Cloudflare handles this)
    ##
    gzip off;

    ##
    # Virtual Host Configs
    ##
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
