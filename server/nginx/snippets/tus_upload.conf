## =================================================
#  TUS Node Uploads
#
#  Include using:
#  location ^~ /files/ {
#    proxy_pass http://127.0.0.1:1080;
#    include /etc/nginx/snippets/tus-upload.conf;
#  }
## =================================================

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;

proxy_request_buffering off;
proxy_buffering off;

proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;

client_max_body_size 2G;

# --- CORS ---
if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin $cors_allowed_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization,Content-Type,Tus-Resumable,Upload-Length,Upload-Offset,Upload-Metadata" always;
    add_header Access-Control-Max-Age 86400 always;
    add_header Content-Length 0;
    return 204;
}

add_header Access-Control-Allow-Origin $cors_allowed_origin always;
add_header Access-Control-Allow-Credentials true always;
add_header Access-Control-Expose-Headers "Upload-Offset,Location,Content-Length" always;
add_header Vary Origin always;
