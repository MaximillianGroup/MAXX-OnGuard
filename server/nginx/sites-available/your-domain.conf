# =========================================================
# UPSTREAM → VARNISH
# =========================================================
upstream varnish_backend {
    server 127.0.0.1:6081;
    keepalive 128;
}

# =========================================================
# MAIN HTTPS TERMINATOR (NGINX → VARNISH → APACHE/PHP-FPM  
# =========================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;

    server_name sparxstar.com *.sparxstar.com;

    ssl_certificate     /etc/ssl/certs/sparxstar.com.pem;
    ssl_certificate_key /etc/ssl/private/sparxstar.com.key;

    # =========================================================
    # 8G FIREWALL: Applied per-server block
    # =========================================================
    include /etc/nginx/snippets/8g-firewall.conf;


    # =========================================================
    # GENERAL CORS (REST / AJAX / STATIC)
    # =========================================================
    
    # Preflight
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_allowed_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE, PATCH" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-WP-Nonce, X-HTTP-Method-Override, X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0;
        return 204;
    }
    
    # Normal requests
    add_header Access-Control-Allow-Origin $cors_allowed_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Vary Origin always;

    # =========================================================
    # TUS NODE: Bypass Varnish (Direct Port 1080)
    # =========================================================
    location ^~ /files/ {
        proxy_pass http://127.0.0.1:1080; # Direct to TUS

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # --- CORS for TUS ---
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type,Tus-Resumable,Upload-Length,Upload-Offset,Upload-Metadata" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }
        
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Expose-Headers "Upload-Offset,Location,Content-Length" always;
        add_header Vary Origin always;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Upload Optimization: No buffering for the node
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        client_max_body_size 2G; 
    }

    # =========================================================
    # NORMAL TRAFFIC: To Varnish (Port 6081)
    # =========================================================
    location / {
        proxy_pass http://varnish_backend;
        
        proxy_http_version 1.1;
        proxy_set_header Connection ""; # Enable Keepalive to Varnish
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Standard Buffering
        proxy_request_buffering on;
        proxy_buffering on;
    }

    # =========================================================
    # HARD BLOCK XML-RPC
    # =========================================================
    location = /xmlrpc.php {
        deny all;
        access_log off;
    }
}
