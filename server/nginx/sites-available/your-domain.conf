# =========================================================
# UPSTREAM → VARNISH
# =========================================================
upstream varnish_backend {
    server 127.0.0.1:6081;
    keepalive 128;
}

# =========================================================
# DEFAULT CATCH ALL SERVER
# =========================================================
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;

    server_name _;

    ssl_certificate     /etc/ssl/certs/sparxstar.com.pem;
    ssl_certificate_key /etc/ssl/private/sparxstar.com.key;

    return 444;
}


# =========================================================
# MAIN HTTPS TERMINATOR (NGINX → VARNISH → APACHE/PHP-FPM  
# =========================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name sparxstar.com *.sparxstar.com;

    ssl_certificate     /etc/ssl/certs/sparxstar.com.pem;
    ssl_certificate_key /etc/ssl/private/sparxstar.com.key;

    # =========================================================
    # 8G FIREWALL
    # XML-RPC BLOCKER
    # GENERAL CORS (REST / AJAX / STATIC)
    # =========================================================
    include /etc/nginx/snippets/8g-firewall.conf;
    include /etc/nginx/snippets/block-xmlrpc.conf;
    include /etc/nginx/snippets/cors-general.conf;

    # =========================================================
    # TUS NODE: Bypass Varnish (Direct Port 1080)
    # =========================================================
    location ^~ /files/ {
        proxy_pass http://127.0.0.1:1080;
        include /etc/nginx/snippets/tus-upload.conf;
    }

    # =========================================================
    # NORMAL TRAFFIC: To Varnish (Port 6081)
    # =========================================================
    location / {
        proxy_pass http://varnish_backend;
        include /etc/nginx/snippets/proxy-varnish.conf;
    }
}

