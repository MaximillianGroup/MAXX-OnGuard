# =========================================================
# FORCE HTTPS
# =========================================================
server {
    listen 80;
    listen [::]:80;

    server_name
        sparxstar.com *.sparxstar.com aiwestafrica.com *.aiwestafrica.com afrobeatsafrica.com *.afrobeatsafrica.com afrobeatswest.com *.afrobeatswest.com
        barbarabarrett.org *.barbarabarrett.org casanovaandrosetta.com *.casanovaandrosetta.com cellularvibrations.com *.cellularvibrations.com;

    return 301 https://$host$request_uri;
}

