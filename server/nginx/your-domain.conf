# =========================================================
# UPSTREAM → VARNISH
# =========================================================
upstream varnish_backend {
    server 127.0.0.1:6081;
    keepalive 128;
}

# =========================================================
# MAIN HTTPS TERMINATOR (NGINX → VARNISH → APACHE/PHP-FPM)
# =========================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name sparxstar.com *.sparxstar.com;

    ssl_certificate     /etc/ssl/certs/sparxstar.pem;
    ssl_certificate_key /etc/ssl/private/sparxstar.key;

    # ---------------------------------------------------------
    # 1. 8G FIREWALL: Applied per-server block
    # ---------------------------------------------------------
    include /etc/nginx/snippets/8g-firewall.conf;

    # ---------------------------------------------------------
    # 2. TUS NODE: Bypass Varnish (Direct Port 1080)
    # ---------------------------------------------------------
    location ^~ /files/ {
        proxy_pass http://127.0.0.1:1080; # Direct to TUS

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Upload Optimization: No buffering for the node
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 0; 
    }

    # ---------------------------------------------------------
    # 3. NORMAL TRAFFIC: To Varnish (Port 6081)
    # ---------------------------------------------------------
    location / {
        proxy_pass http://varnish_backend;
        
        proxy_http_version 1.1;
        proxy_set_header Connection ""; # Enable Keepalive to Varnish
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Standard Buffering
        proxy_request_buffering on;
        proxy_buffering on;
    }

    # ---------------------------------------------------------
    # 4. HARD BLOCK XML-RPC
    # ---------------------------------------------------------
    location = /xmlrpc.php {
        deny all;
        access_log off;
    }
}
